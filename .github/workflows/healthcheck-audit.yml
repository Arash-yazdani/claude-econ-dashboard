# Routine healthcheck audit — queries healthchecks.io for the status of every check.
#
# Runs every 6 hours and on manual dispatch. Read-only: it never pings or modifies a check.
# A DOWN check fails the job and sends a Slack alert, so you hear about it even when the
# individual check's own notification was missed or filtered.
#
# Requires the HEALTHCHECKS_RO_KEY secret (read-only, project-scoped):
#   gh secret set HEALTHCHECKS_RO_KEY -R Arash-yazdani/claude-econ-dashboard

name: healthcheck-audit

on:
  # DISABLED in claude-econ-dashboard until AWS + GitHub secrets are wired (see README,
  # 'Before anything runs'). Uncomment the schedule block to enable.
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC. The AM briefing fires ~14:45 UTC and the
    # PM ~21:30 UTC, so the 18:00 run catches a missed AM and the 00:00 run catches a missed PM.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e . -c constraints.txt

      - name: Query all healthchecks
        env:
          HEALTHCHECKS_RO_KEY: ${{ secrets.HEALTHCHECKS_RO_KEY }}
          ALERT_SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK }}
        run: python scripts/check_healthchecks.py --alert
