# One-click run of scripts/compare_models.py --live: replays the 12 locked regression requests
# through the original Gemini/Groq stack and the Claude-on-Bedrock stack, writes docs/comparison.md.
# Manual only. Needs GEMINI_API_KEY and GROQ_API_KEY as repo secrets (Arash adds them; the script
# refuses to start without them). Spends a few cents of Bedrock plus free-tier Gemini/Groq quota.

name: compare-models

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # GitHub OIDC -> AWS role

concurrency:
  group: eval-log-writers
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 from 2026-10-19
    steps:
      - name: Refuse to run inside a production briefing window
        run: |
          HHMM=$(date -u +%H%M)
          if { [ "$HHMM" -ge 1430 ] && [ "$HHMM" -le 1630 ]; } || { [ "$HHMM" -ge 2115 ] && [ "$HHMM" -le 2315 ]; }; then
            echo "::error::Inside a briefing window ($HHMM UTC). Re-run outside 14:30-16:30 / 21:15-23:15 UTC."
            exit 1
          fi

      - uses: actions/checkout@v7

      # Short-lived AWS credentials via GitHub OIDC (role claude-econ-github, main branch only).
      # Replaced the claude-econ-bot access key on 2026-10-26; no long-lived AWS key in GitHub.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::179897609265:role/claude-econ-github
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install -e . -c constraints.txt

      - name: Compare stacks
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/compare_models.py --live

      - name: Commit docs/comparison.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/comparison.md
          git diff --cached --quiet || git commit -m "docs: model comparison $(date -u +%F)"
          git pull --rebase && git push
