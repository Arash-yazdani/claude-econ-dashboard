# One-off: which Bedrock model id forms accept messages.create? Delete after use.
name: model-id-check
on: workflow_dispatch
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip -q install "anthropic[bedrock]>=1.17" boto3
      - env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os, anthropic, boto3
          reg = os.environ["AWS_REGION"]
          ids = []
          try:
              b = boto3.client("bedrock", region_name=reg)
              for p in b.list_inference_profiles(typeEquals="SYSTEM_DEFINED", maxResults=1000)["inferenceProfileSummaries"]:
                  if "haiku" in p["inferenceProfileId"]:
                      print("PROFILE", p["inferenceProfileId"]); ids.append(p["inferenceProfileId"])
          except Exception as e:
              print("LIST FAIL", type(e).__name__, str(e)[:300])
          c = anthropic.AnthropicBedrock(aws_region=reg)
          for m in ids or ["us.anthropic.claude-haiku-4-5-20251001-v1:0", "global.anthropic.claude-haiku-4-5-20251001-v1:0"]:
              try:
                  r = c.messages.create(model=m, max_tokens=5, messages=[{"role": "user", "content": "hi"}])
                  print("OK  ", m, r.stop_reason)
              except Exception as e:
                  print("FAIL", m, type(e).__name__, str(e)[:300])
          PY
