# One-off: which Bedrock model id forms accept messages.create? Delete after use.
name: model-id-check
on: workflow_dispatch
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip -q install "anthropic[bedrock]>=1.17" boto3
      - env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os, json, anthropic, boto3
          reg = os.environ["AWS_REGION"]
          try:
              b = boto3.client("bedrock", region_name=reg)
              for p in b.list_inference_profiles(typeEquals="SYSTEM_DEFINED", maxResults=1000)["inferenceProfileSummaries"]:
                  if "anthropic" in p["inferenceProfileId"]:
                      print("PROFILE", p["inferenceProfileId"])
          except Exception as e:
              print("LIST FAIL", type(e).__name__, str(e)[:200])
          c = anthropic.AnthropicBedrock(aws_region=reg)
          schema = {"type": "object", "properties": {"x": {"type": "string"}}, "required": ["x"], "additionalProperties": False}
          variants = {
              "plain": {},
              "format": {"output_config": {"format": {"type": "json_schema", "schema": schema}}},
              "format+effort": {"output_config": {"effort": "low", "format": {"type": "json_schema", "schema": schema}}},
          }
          for m in ["us.anthropic.claude-haiku-4-5-20251001-v1:0", "global.anthropic.claude-haiku-4-5-20251001-v1:0"]:
              for name, extra in variants.items():
                  try:
                      r = c.messages.create(model=m, max_tokens=50, messages=[{"role": "user", "content": "Reply with x=hi"}], **extra)
                      print("OK  ", m, name, r.stop_reason, (r.content[0].text if r.content else "")[:60])
                  except Exception as e:
                      print("FAIL", m, name, type(e).__name__, str(e)[:200])
          PY
